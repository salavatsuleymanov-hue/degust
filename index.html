<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дегустация</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 20px auto; padding: 0 15px; background: #f9f9f9; }
        h1 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 180px; font-weight: bold; }
        select, input[type="number"], input[type="text"] { padding: 8px; width: 200px; border: 1px solid #ccc; border-radius: 4px; }
        input[type="number"] { width: 80px; }
        .char-row { display: flex; align-items: center; margin-bottom: 8px; }
        .char-row label { width: 180px; font-weight: normal; }
        button { background: #4CAF50; color: white; padding: 12px 30px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; display: block; margin: 20px auto; }
        button:hover { background: #45a049; }
        #status { text-align: center; font-weight: bold; margin-top: 15px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Оценка товара</h1>
    <form id="evaluationForm">
        <div class="form-group">
            <label for="participant">Участник (имя или номер):</label>
            <input type="text" id="participant" required>
        </div>
        <div class="form-group">
            <label for="product">Товар:</label>
            <select id="product" required>
                <option value="">Выберите...</option>
                <option value="Товар 1">Товар 1</option>
                <option value="Товар 2">Товар 2</option>
                <option value="Товар 3">Товар 3</option>
                <option value="Товар 4">Товар 4</option>
                <option value="Товар 5">Товар 5</option>
                <option value="Товар 6">Товар 6</option>
                <option value="Товар 7">Товар 7</option>
                <option value="Товар 8">Товар 8</option>
                <option value="Товар 9">Товар 9</option>
                <option value="Товар 10">Товар 10</option>
            </select>
        </div>

        <h3>Оцените по шкале от 1 до 5</h3>
        <div class="char-row"><label>Внешний вид:</label><input type="number" name="char1" min="1" max="5" required></div>
        <div class="char-row"><label>Цвет:</label><input type="number" name="char2" min="1" max="5" required></div>
        <div class="char-row"><label>Аромат:</label><input type="number" name="char3" min="1" max="5" required></div>
        <div class="char-row"><label>Вкус:</label><input type="number" name="char4" min="1" max="5" required></div>
        <div class="char-row"><label>Текстура / консистенция:</label><input type="number" name="char5" min="1" max="5" required></div>
        <div class="char-row"><label>Послевкусие:</label><input type="number" name="char6" min="1" max="5" required></div>
        <div class="char-row"><label>Сбалансированность:</label><input type="number" name="char7" min="1" max="5" required></div>
        <div class="char-row"><label>Интенсивность:</label><input type="number" name="char8" min="1" max="5" required></div>
        <div class="char-row"><label>Общее впечатление:</label><input type="number" name="char9" min="1" max="5" required></div>
        <div class="char-row"><label>Готовность рекомендовать:</label><input type="number" name="char10" min="1" max="5" required></div>

        <button type="submit">Отправить оценку</button>
    </form>
    <div id="status"></div>

    <script>
        document.getElementById('evaluationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const status = document.getElementById('status');
            status.textContent = 'Отправка...';
            status.className = '';

            const formData = new FormData(this);
            const data = {};
            for (let [key, value] of formData.entries()) {
                data[key] = value;
            }
            data.timestamp = new Date().toISOString();

            try {
                // ⚠️ ЗАМЕНИТЕ НА ВАШ РЕАЛЬНЫЙ URL (без лишних пробелов)
                const response = await fetch('https://script.google.com/macros/s/ВАШ_УНИКАЛЬНЫЙ_КОД/exec', {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    status.textContent = '✅ Оценка сохранена!';
                    status.className = 'success';
                    this.reset();
                } else {
                    const errorText = await response.text();
                    status.textContent = '❌ Ошибка: ' + errorText;
                    status.className = 'error';
                }
            } catch (error) {
                status.textContent = '❌ Ошибка сети: ' + error.message;
                status.className = 'error';
                // Дополнительно выводим в консоль для отладки
                console.error('Ошибка fetch:', error);
            }
        });
    </script>
</body>
</html>
