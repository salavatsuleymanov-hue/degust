<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дегустация (ТЕСТ)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 20px auto; padding: 0 15px; background: #f9f9f9; }
        h1 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 180px; font-weight: bold; }
        select, input[type="number"], input[type="text"] { padding: 8px; width: 200px; border: 1px solid #ccc; border-radius: 4px; }
        input[type="number"] { width: 80px; }
        .char-row { display: flex; align-items: center; margin-bottom: 8px; }
        .char-row label { width: 180px; font-weight: normal; }
        button { background: #4CAF50; color: white; padding: 12px 30px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; display: block; margin: 20px auto; }
        button:hover { background: #45a049; }
        #status { text-align: center; font-weight: bold; margin-top: 15px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Оценка товара (ТЕСТОВАЯ ВЕРСИЯ — 2 товар, 1 свойство)</h1>
    <form id="evaluationForm">
        <div class="form-group">
            <label for="participant">Участник (имя или номер):</label>
            <input type="text" id="participant" required>
        </div>
        <div class="form-group">
            <label for="product">Товар:</label>
            <select id="product" required>
                <option value="">Выберите...</option>
                <option value="Товар 1">Товар 1</option>
            </select>
        </div>

        <h3>Оцените по шкале от 1 до 5</h3>
        <div class="char-row"><label>Внешний вид:</label><input type="number" name="char1" min="1" max="5" required></div>

        <button type="submit">Отправить оценку</button>
    </form>
    <div id="status"></div>

    <script>
        document.getElementById('evaluationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const status = document.getElementById('status');
            status.textContent = 'Отправка...';
            status.className = '';

            const formData = new FormData(this);
            const data = {};
            for (let [key, value] of formData.entries()) {
                data[key] = value;
            }
            data.timestamp = new Date().toISOString();

            // ВАШ ОРИГИНАЛЬНЫЙ URL (без изменений)
            //const scriptUrl = 'https://script.google.com/macros/s/AKfycbxZobmhBB-iKpYQyP2X0_KyoE3ZT7tI78ad4IXzJanuWis55-TBopi6duIEHvF4JsQs/exec';

            // ЕСЛИ НЕ РАБОТАЕТ, РАСКОММЕНТИРУЙТЕ СТРОКУ НИЖЕ И ЗАКОММЕНТИРУЙТЕ ВЕРХНЮЮ
            const scriptUrl = 'https://cors-anywhere.herokuapp.com/' + 'https://script.google.com/macros/s/AKfycbxZobmhBB-iKpYQyP2X0_KyoE3ZT7tI78ad4IXzJanuWis55-TBopi6duIEHvF4JsQs/exec';

            try {
                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    status.textContent = '✅ Оценка сохранена!';
                    status.className = 'success';
                    this.reset();
                } else {
                    const errorText = await response.text();
                    status.textContent = '❌ Ошибка: ' + errorText;
                    status.className = 'error';
                }
            } catch (error) {
                status.textContent = '❌ Ошибка сети: ' + error.message;
                status.className = 'error';
                console.error('Ошибка fetch:', error);
            }
        });
    </script>
</body>
</html>
